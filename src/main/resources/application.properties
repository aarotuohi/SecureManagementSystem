spring.application.name=securemanagementsystem

# Management/Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# OpenAPI UI (Swagger)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Database (override via env in dev/prod)
# spring.datasource.url=jdbc:postgresql://localhost:5432/securedb
# spring.datasource.username=secure
# spring.datasource.password=secret
# spring.jpa.hibernate.ddl-auto=update

# JWT (use a strong Base64 secret in env: JWT_SECRET)
jwt.secret=
