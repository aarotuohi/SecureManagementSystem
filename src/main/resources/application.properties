spring.application.name=securemanagementsystem
server.port=8081


# Management/Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# OpenAPI UI (Swagger)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Database: H2 file-based for local persistence; override with Postgres via env/profiles
# Data files will be created under ./securedb.* in the project directory
# Note: AUTO_SERVER and DB_CLOSE_ON_EXIT are not supported on H2 2.x, keep it simple.
spring.datasource.url=jdbc:h2:file:./securedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Postgres example (uncomment and set to use Postgres):
# spring.datasource.url=jdbc:postgresql://localhost:5432/securedb
# spring.datasource.username=secure
# spring.datasource.password=secret
# spring.jpa.hibernate.ddl-auto=update

# JWT (use a strong Base64 secret in env: JWT_SECRET)
jwt.secret=

# Cleaner console output
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.org.hibernate=warn
logging.level.org.springframework.orm.jpa=info
logging.level.org.springframework.web=info
