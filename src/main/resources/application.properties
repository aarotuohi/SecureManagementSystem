spring.application.name=securemanagementsystem
server.port=8081


# Management/Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# OpenAPI UI (Swagger)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Database: default to H2 in-memory for local dev; override with Postgres via env/profiles
spring.datasource.url=jdbc:h2:mem:securedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Postgres example (uncomment and set to use Postgres):
# spring.datasource.url=jdbc:postgresql://localhost:5432/securedb
# spring.datasource.username=secure
# spring.datasource.password=secret
# spring.jpa.hibernate.ddl-auto=update

# JWT (use a strong Base64 secret in env: JWT_SECRET)
jwt.secret=
